[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-pain-narratives"
version = "1.0.0"
description = "Multilingual dental pain narrative classification and evidence extraction"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
  "pandas>=2,<4",
  "PyYAML>=6,<7",
  "scipy>=1.11,<2",
  "networkx>=3,<4",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "openpyxl>=3.1,<4"]
inference = [
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=4.51",
  "accelerate>=1",
  "bitsandbytes>=0.45",
  "sentence-transformers>=3",
  "huggingface-hub>=0.30",
]
reranker = ["FlagEmbedding>=1.3"]

[project.scripts]
dental-ai = "dental_ai.cli:main"

[tool.setuptools.packages.find]
include = ["dental_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
